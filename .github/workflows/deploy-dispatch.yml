name: Deploy Dispatch

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify merged pull request SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: sh deploy/verify-merged-main-sha.sh "$GITHUB_REPOSITORY" "$TARGET_SHA"
      - name: Dispatch private deployment workflow
        env:
          GH_TOKEN: ${{ secrets.TASKFLOW_DEPLOY_DISPATCH_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$GH_TOKEN"
          gh workflow run deploy.yml \
            --repo heojungseok/taskflow-deployment \
            --ref main \
            -f target_sha="$TARGET_SHA" \
            -f approve_risky=false
