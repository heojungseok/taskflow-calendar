apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: taskflow-discord
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: '{{ template "taskflow.discord.title" . }}'
          message: '{{ template "taskflow.discord.message" . }}'
        disableResolveMessage: false
  - orgId: 1
    name: incident-agent
    receivers:
      - uid: incident-agent-webhook
        type: webhook
        settings:
          url: http://incident-agent:8080/grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${AGENT_WEBHOOK_TOKEN}
        disableResolveMessage: false

templates:
  - orgId: 1
    name: taskflow-discord
    template: |
      {{ define "taskflow.discord.title" }}
      {{- $severity := "WARNING" -}}
      {{- range .Alerts -}}{{ if eq .Labels.severity "critical" }}{{ $severity = "CRITICAL" }}{{ end }}{{ end -}}
      {{- if gt (len .Alerts.Firing) 0 -}}[장애][{{ $severity }}] TaskFlow {{ .GroupLabels.environment }} · {{ len .Alerts }}건{{- else -}}[복구][{{ $severity }}] TaskFlow {{ .GroupLabels.environment }} · {{ len .Alerts }}건{{- end -}}
      {{ end }}
      {{ define "taskflow.discord.message" }}
      {{- if le (len .Alerts) 2 }}{{ template "taskflow.discord.detail" . }}{{ else }}{{ template "taskflow.discord.summary" . }}{{ end }}
      {{- end }}
      {{ define "taskflow.discord.summary" }}
      {{- $externalURL := .ExternalURL }}
      **현재 상태** 발생 {{ len .Alerts.Firing }}건 / 복구 {{ len .Alerts.Resolved }}건 (3건 이상이라 요약)
      {{- range .Alerts.Firing }}
      - [발생] {{ .Annotations.summary }} · {{ .Labels.service }} · {{ .StartsAt | tz "Asia/Seoul" | date "15:04" }}
      {{- end }}
      {{- range .Alerts.Resolved }}
      - [복구] {{ .Annotations.summary }} · {{ .Labels.service }} · {{ .EndsAt | tz "Asia/Seoul" | date "15:04" }}
      {{- end }}

      **Grafana** [알림 목록]({{ $externalURL }}alerting/list) · [대시보드]({{ $externalURL }}d/taskflow/taskflow)
      {{- end }}
      {{ define "taskflow.discord.detail" }}
      {{- $externalURL := .ExternalURL -}}
      {{- if gt (len .Alerts.Firing) 0 }}
      **현재 상태** 발생 {{ len .Alerts.Firing }}건{{ if gt (len .Alerts.Resolved) 0 }} / 복구 {{ len .Alerts.Resolved }}건{{ end }}
      {{- range .Alerts.Firing }}

      ### [발생] {{ .Annotations.summary }}
      **발생 시각** {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}
      **대상** {{ .Labels.service }}
      **영향** {{ .Annotations.impact }}
      **권장 조치** {{ .Annotations.action }}
      {{- if .Annotations.check_url }}
      **1차 확인** 공개 데모 origin의 `{{ .Annotations.check_url }}`
      {{- end }}
      {{- if .PanelURL }}
      **Grafana** [관련 패널 열기]({{ .PanelURL }})
      {{- else if .DashboardURL }}
      **Grafana** [대시보드 열기]({{ .DashboardURL }})
      {{- else }}
      **Grafana** [대시보드 열기]({{ $externalURL }}d/taskflow/taskflow)
      {{- end }}
      **일시정지** [이 알림 끄기]({{ $externalURL }}alerting/silence/new?alertmanager=grafana&matcher=alertname%3D{{ .Labels.alertname | urlquery }})
      {{- end }}
      {{- $backendLogs := false }}{{ $nginxLogs := false }}
      {{- range .Alerts.Firing }}{{ if eq .Labels.service "backend" }}{{ $backendLogs = true }}{{ end }}{{ if eq .Labels.service "nginx" }}{{ $nginxLogs = true }}{{ end }}{{ end }}
      {{- if $backendLogs }}
      **로그** [backend 최근 로그 보기]({{ $externalURL }}explore?schemaVersion=1&orgId=1&panes={{ `{"a":{"datasource":"loki","queries":[{"refId":"A","expr":"{service=\"backend\"}"}]}}` | urlquery }})
      {{- end }}
      {{- if $nginxLogs }}
      **로그** [nginx 최근 로그 보기]({{ $externalURL }}explore?schemaVersion=1&orgId=1&panes={{ `{"a":{"datasource":"loki","queries":[{"refId":"A","expr":"{service=\"nginx\"}"}]}}` | urlquery }})
      {{- end }}
      {{- else }}
      **현재 상태** 복구 {{ len .Alerts.Resolved }}건
      {{- end }}
      {{- range .Alerts.Resolved }}

      ### [복구] {{ .Annotations.summary }}
      **복구 시각** {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}
      **대상** {{ .Labels.service }}
      **결과** 알럿 상태가 정상화됐습니다.
      {{- if .Annotations.check_url }}
      **추가 확인 필요** 공개 데모 origin의 `{{ .Annotations.check_url }}`
      {{- end }}
      {{- if .PanelURL }}
      **Grafana** [관련 패널 열기]({{ .PanelURL }})
      {{- else if .DashboardURL }}
      **Grafana** [대시보드 열기]({{ .DashboardURL }})
      {{- else }}
      **Grafana** [대시보드 열기]({{ $externalURL }}d/taskflow/taskflow)
      {{- end }}
      {{- end }}
      {{ end }}

policies:
  - orgId: 1
    receiver: Discord
    group_by: [environment]
    group_wait: 30s
    repeat_interval: 4h
    routes:
      # 알림을 분석기에도 보낸다. continue라서 아래 Discord 경로도 이어서 평가한다.
      - receiver: incident-agent
        continue: true
        object_matchers:
          - [service, "!=", incident-agent]
        group_by: [alertname, service]
      # 보안 알림(security.yml)은 IP마다 따로 보내고 종료 메시지를 끈 연락처를 쓴다.
      - receiver: Discord security
        object_matchers:
          - [service, =, security]
        group_by: [alertname, ip]
      # 위 경로가 continue로 매칭되면 root receiver로 떨어지지 않으므로 나머지는 Discord로 명시한다.
      - receiver: Discord

groups:
  - orgId: 1
    name: TaskFlow public demo
    folder: TaskFlow
    interval: 1m
    rules:
      - uid: taskflow-demo-usage
        title: demo usage
        condition: C
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: gateway
          severity: warning
        annotations:
          summary: 공개 데모 사용량 증가
          impact: 신규 DEMO 세션과 Google 미연결 Calendar skip이 함께 늘어 공개 데모 처리량과 외부 API 사용 한도에 부담이 생길 수 있습니다.
          action: DEMO 시작·Task 생성 추이와 rate limit 차단 로그를 확인하고 지속되면 데모 세션 생성 제한을 임시로 낮추세요.
          check_url: /healthz
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 3600, to: 0}
            model: {refId: A, expr: '(sum(increase(demo_sessions_started_total[1h])) >= 3 and sum(increase(outbox_processed_total{outcome="skipped",reason="no_google_link"}[1h])) >= 5) or vector(0)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-abuse
        title: demo traffic spike
        condition: C
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: gateway
          severity: warning
        annotations:
          summary: DEMO 트래픽 급증
          impact: 10분 내 DEMO 세션 또는 Google 미연결 요청이 급증해 정상 사용자의 요청이 제한되거나 서버 부하가 커질 수 있습니다.
          action: 요청 IP·rate limit 차단 현황을 확인하고 비정상 반복이면 해당 경로 제한을 강화하세요.
          check_url: /healthz
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, expr: '(sum(increase(demo_sessions_started_total[10m])) >= 20 or sum(increase(outbox_processed_total{outcome="skipped",reason="no_google_link"}[10m])) >= 50) or vector(0)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-worker-backlog
        title: worker backlog
        condition: C
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: worker
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "17"
          summary: Worker 처리 지연
          impact: 처리 가능한 Outbox 이벤트가 3분 넘게 처리되지 않아 Calendar 반영이 늦어지고 있습니다. 값은 Prometheus가 지표를 가져갈 때 DB에서 직접 계산해, Worker가 멈춰도 올라갑니다.
          action: 'Grafana Explore의 Loki에서 {service="backend"} |= "[Worker]"로 최근 처리 로그와 outbox_slow 건을 확인하세요. 처리 로그가 없으면 Worker가 멈춘 것이므로 backend를 재기동하고 대기 시간이 줄어드는지 확인하세요.'
          check_url: /healthz
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'max(outbox_oldest_processable_age_seconds) or vector(0)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [180]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-backend-down
        title: backend metrics collection down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: backend
          severity: critical
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "2"
          summary: Backend 메트릭 수집 중단
          impact: Prometheus가 Backend Actuator 메트릭을 2분 이상 수집하지 못해 실제 API 장애 여부와 운영 상태를 판단할 수 없습니다.
          action: 먼저 공개 origin의 세션 확인 주소로 API 응답을 확인한 뒤 Backend 컨테이너·9091 포트·Prometheus target 상태와 최근 로그를 순서대로 확인하세요.
          check_url: /api/auth/session
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'up{job="taskflow"}', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-database-metrics-down
        title: database metrics collection down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: postgres
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "44"
          summary: DB 메트릭 수집 중단
          impact: Prometheus가 PostgreSQL 지표를 5분 이상 받지 못해 DB 연결 고갈이나 크기 증가를 알아챌 수 없습니다.
          action: postgres-exporter 컨테이너 상태와 로그를 먼저 보고, taskflow_monitor 계정 접속(비밀번호·연결 한도)과 Prometheus target 상태를 순서대로 확인하세요.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'min(pg_up) * min(up{job="postgres"}) * min(pg_scrape_collector_success{collector=~"stat_activity|settings|database"})', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-database-connections-high
        title: database connections near limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: postgres
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "45"
          summary: DB 연결 수 한도 근접
          impact: PostgreSQL 연결이 최대 연결 수의 80%를 5분 넘게 넘어, 곧 새 요청이 DB 연결을 얻지 못할 수 있습니다.
          action: DB 연결 수 패널에서 상태별(idle·active) 연결을 확인하고, Backend Hikari 대기 수와 오래 걸리는 쿼리를 함께 확인하세요.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'sum(pg_stat_activity_count) / max(pg_settings_max_connections)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.8]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-container-memory-high
        title: docker memory pressure
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: containers
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "48"
          summary: Docker 메모리 압박
          impact: 컨테이너 전체 메모리가 Docker가 쓸 수 있는 메모리의 90%를 10분 넘게 넘어, 곧 컨테이너가 OOM으로 재시작되거나 서비스 전체가 느려질 수 있습니다.
          action: 컨테이너 메모리 패널에서 가장 많이 쓰는 서비스를 확인하고, Backend라면 JVM heap 패널과 최근 오류 로그를 함께 확인하세요.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'sum(taskflow_container_memory_bytes) / scalar(max(taskflow_docker_memory_total_bytes))', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.9]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-container-cpu-high
        title: container cpu high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: containers
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "47"
          summary: 컨테이너 CPU 과다
          impact: 한 서비스가 5분 평균으로 CPU 코어 한 개 분량의 90% 이상을 15분 넘게 쓰고 있어, 같은 호스트의 다른 서비스 응답이 늦어질 수 있습니다.
          action: 컨테이너 CPU 패널에서 서비스를 확인하고, 같은 시간대의 요청량·Worker 적체·DEMO 트래픽을 함께 확인하세요.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'max by (service) (avg_over_time(taskflow_container_cpu_ratio[5m]))', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.9]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-container-stats-stale
        title: container stats collection stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: containers
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "49"
          summary: 컨테이너 자원 수집 중단
          impact: 운영 호스트의 컨테이너 자원 수집이 3분 넘게 갱신되지 않아 메모리·CPU 과다를 알아챌 수 없습니다.
          action: 운영 호스트의 수집 작업 상태와 수집 폴더의 파일 시각을 먼저 보세요. 파일이 최신인데도 알림이 계속되면 수집 폴더가 다시 만들어진 것이니 container-stats-exporter를 재시작하세요.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'time() - max(node_textfile_mtime_seconds{file="/textfile/containers.prom"})', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [180]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-cleanup-failure
        title: cleanup failure
        condition: C
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: cleanup
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "18"
          summary: Cleanup 작업 실패
          impact: 만료된 DEMO 사용자와 연결 데이터가 남아 저장 공간과 공개 데모 운영 한도에 영향을 줄 수 있습니다.
          action: Cleanup 예외 로그를 확인하고 원인을 해결한 뒤 스케줄러를 재실행해 만료 사용자 수가 감소하는지 확인하세요.
          check_url: /healthz
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'sum(increase(demo_cleanup_failures_total[15m])) or vector(0)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-cleanup-overdue
        title: cleanup overdue
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: cleanup
          severity: warning
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "19"
          summary: Cleanup 실행 지연
          impact: 만료된 DEMO 데이터가 10분 넘게 남아 있어 정리 스케줄러가 멈췄거나 처리 속도가 부족할 수 있습니다.
          action: Cleanup 스케줄러 활성화 여부와 마지막 실행 로그를 확인하고 누락이면 즉시 한 번 실행하세요.
          check_url: /healthz
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, expr: 'max(demo_oldest_expired_age_seconds) or vector(0)', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [600]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-gemini-quota-exhausted
        title: gemini quota exhausted
        condition: C
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: gemini
          severity: critical
        annotations:
          __dashboardUid__: taskflow
          __panelId__: "24"
          summary: 'Gemini quota 소진 ({{ $labels.feature }})'
          impact: 해당 Gemini 기능의 요청이 quota 소진으로 실패해 요약·추천·검색 보조 결과를 제공하지 못할 수 있습니다.
          action: Gemini 사용량과 결제·quota 설정을 확인하고 복구 전까지 해당 기능의 재시도 요청을 줄이세요.
          check_url: /api/auth/session
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'sum by (feature) (increase(gemini_calls_total{provider="gemini",outcome="failure",error_code="LLM_QUOTA_EXHAUSTED"}[5m]))', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

