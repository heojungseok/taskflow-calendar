      - uid: taskflow-log-pipeline-silent
        title: backend log pipeline silent
        condition: C
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        labels:
          environment: public-demo
          service: backend
          severity: warning
        annotations:
          summary: Backend 로그 수집 끊김
          impact: Backend가 5분마다 남기는 heartbeat가 15분 동안 Loki에 들어오지 않아, 장애가 나도 로그로 원인을 확인할 수 없습니다.
          action: Backend 컨테이너가 살아 있으면 Alloy 컨테이너와 수신 포트(UDP 5140), Loki 순서로 확인하세요. Backend 스케줄러가 다른 작업에 오래 묶여 heartbeat가 밀린 경우일 수도 있습니다.
          check_url: /api/auth/session
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, queryType: instant, expr: 'sum(count_over_time({service="backend"} |~ `^INFO +\S*LogPipelineHeartbeat : log pipeline heartbeat$` [15m])) or vector(0)'}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}

      - uid: taskflow-backend-error-logs
        title: backend error logs
        condition: C
        noDataState: OK
        execErrState: OK
        isPaused: false
        labels:
          environment: public-demo
          service: backend
          severity: warning
        annotations:
          summary: Backend ERROR 로그 발생
          impact: 최근 5분 동안 Backend가 ERROR 로그를 남겼습니다. 사용자 요청이나 Worker가 실패하고 있을 수 있습니다.
          action: 'Grafana Explore에서 {service="backend"} |~ "^ERROR " 로 메시지를 확인하고, 요청 중 오류면 메시지 뒤 traceId= 값으로 {service="backend"} |= "traceId=<값>" 을 검색해 같은 요청의 로그를 보세요. 예외 원인은 같은 줄의 " | " 뒤에 있습니다. Loki 장애는 로그 수집 끊김 알림이 알립니다.'
          check_url: /api/auth/session
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, queryType: instant, expr: 'sum(count_over_time({service="backend"} |~ "^ERROR " [5m])) or vector(0)'}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}, operator: {type: and}, query: {params: [C]}, reducer: {type: last, params: []}, type: query}]}
