global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: containers
    static_configs:
      - targets: [container-stats-exporter:9100]
