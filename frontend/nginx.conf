pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # cloudflared는 127.0.0.1:8088 포트 매핑을 거쳐 Docker 게이트웨이(172.x) 주소로 들어온다.
    # 그대로 두면 모든 방문자가 같은 IP로 보여 아래 IP별 요청 제한이 전체 공용 한도가 된다.
    # nginx는 127.0.0.1에만 열려 있고(verify-compose-boundary.sh가 확인) edge 네트워크에만 붙으므로
    # Docker가 네트워크에 나눠 주는 사설 대역에서 온 요청만 헤더를 믿는다.
    # 네트워크를 다시 만들면 172.x 대신 192.168.x를 받을 수 있어 세 대역을 모두 둔다.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    limit_req_status 429;

    # 쿼리 문자열에는 자연어 검색어 같은 업무 내용이 실릴 수 있어 경로만 남긴다.
    map $request_uri $request_path { ~^(?<path>[^?]*) $path; }
    map $http_referer $referer_path { ~^(?<ref>[^?]*) $ref; }
    log_format security escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$request_path",'
        '"status":"$status","bytes":"$body_bytes_sent","referer":"$referer_path","ua":"$http_user_agent",'
        '"rt":"$request_time"}';
    access_log /dev/stdout security;
    # 같은 로그를 Alloy(log-ingest 네트워크의 고정 IP)로도 보낸다. UDP라 Alloy가 없으면 버려지고 nginx는 영향받지 않는다.
    access_log syslog:server=10.213.47.10:5140,tag=nginx,nohostname security;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=mutation:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=demo:10m rate=3r/m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /actuator { return 404; }
        location ^~ /api/test { return 404; }
        location ^~ /api/admin { return 404; }
        location = /api/oauth/google/callback { access_log off; proxy_pass http://backend:8080; }
        location = /api/auth/demo {
            limit_req zone=demo burst=2 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=mutation burst=20 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # index.html은 캐시하면 안 된다. 새 배포를 해도 옛 화면이 계속 뜬다.
        # CSP도 문서 응답에 묶이므로, 캐시된 index.html은 옛 정책을 계속 적용한다.
        # add_header는 상속되지 않으므로 보안 헤더를 여기에 다시 적는다.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }
}
