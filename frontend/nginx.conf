pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=mutation:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=demo:10m rate=3r/m;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /actuator { return 404; }
        location ^~ /api/test { return 404; }
        location ^~ /api/admin { return 404; }
        location = /api/oauth/google/callback { access_log off; proxy_pass http://backend:8080; }
        location = /api/auth/demo {
            limit_req zone=demo burst=2 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=mutation burst=20 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
