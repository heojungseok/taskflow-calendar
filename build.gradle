plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'co.uzzu.dotenv.gradle' version '2.0.0'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'net.ltgt.errorprone' version '5.1.1'
}

group = 'com.taskflow'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.pgvector:pgvector:0.1.6'

    // Lombok (optional)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Security & JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Google OAuth & Calendar API
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20220715-2.0.0'
    implementation "com.google.http-client:google-http-client-jackson2:1.43.3"

    // ✅ 테스트 의존성 추가
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Static analysis (2.43.0부터 JDK 21 필요. toolchain이 17이라 2.42.0에 고정)
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'
}

dependencyLocking {
    lockAllConfigurations()
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disableWarningsInGeneratedCode = true
}

tasks.named('compileTestJava') {
    // 테스트 메서드 이름은 한글로 짓는다.
    options.errorprone.disable('UnicodeInCode')
}

tasks.named('test') {
    // CI는 ./gradlew test만 실행하고, ci.yml은 배포 제어기가 해시로 고정한다. 포맷 검사를 test에 묶는다.
    dependsOn 'spotlessCheck'
    useJUnitPlatform()
    // application.yml의 jwt.secret은 기본값이 없다. 테스트 컨텍스트도 값이 있어야 뜬다.
    environment 'JWT_SECRET', 'test-only-secret-key-not-used-anywhere-else-256-bits-long'
    environment 'SESSION_COOKIE_SECURE', 'true'
    // token.encryption도 기본값이 없다. salt는 hex여야 한다.
    environment 'TOKEN_ENC_PASSWORD', 'test-only-token-encryption-password'
    environment 'TOKEN_ENC_SALT', '0123456789abcdef0123456789abcdef'
}

// .env 파일 로드
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                systemProperty key.trim(), value.trim()
            }
        }
    }
}
