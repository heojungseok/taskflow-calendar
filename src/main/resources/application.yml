spring:
  application:
    name: taskflow-calendar

  autoconfigure:
    # JWT 전용이라 인메모리 기본 사용자가 필요 없다. 두면 기동 로그에 임시 비밀번호가 찍힌다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    # 기본값은 docker-compose.yml의 로컬 컨테이너와 같다. 배포에서는 환경변수로 덮는다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 배포에서는 validate로 내린다. update는 운영 스키마를 말없이 바꾼다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      environment: ${METRICS_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        gemini_calls: true

logging:
  # 공개 배포에서는 환경변수로 낮춘다. SQL/바인딩 로그는 요청마다 수십 줄이 쌓인다.
  level:
    com.taskflow: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BIND:TRACE}
    org.hibernate.type.descriptor.sql.BasicExtractor: ${LOG_LEVEL_SQL_BIND:TRACE}

jwt:
  # 기본값을 두지 않는다. 저장소에 박힌 시크릿은 곧 인증 우회다.
  # 없으면 기동에 실패한다 - 그게 맞는 동작이다.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:43200000}  # 12 hours in ms

token:
  encryption:
    # jwt.secret과 같은 원칙 - 기본값을 두지 않는다. 없으면 기동에 실패하는 게 맞다.
    # 이 키를 잃으면 저장된 OAuth 토큰은 영구히 복호화할 수 없다.
    password: ${TOKEN_ENC_PASSWORD}
    salt: ${TOKEN_ENC_SALT}  # hex 문자열이어야 한다 (openssl rand -hex 16)

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}
    scope: openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/calendar.events.owned
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token

gemini:
  summary:
    api-key: ${GEMINI_SUMMARY_API_KEY:}
    model: ${GEMINI_SUMMARY_MODEL:gemini-3.1-flash-lite-preview}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 20
    temperature: ${GEMINI_SUMMARY_TEMPERATURE:1.0}
    top-k: ${GEMINI_SUMMARY_TOP_K:20}
    top-p: ${GEMINI_SUMMARY_TOP_P:0.8}
  recommendation:
    api-key: ${GEMINI_RECOMMENDATION_API_KEY:}
    model: ${GEMINI_RECOMMENDATION_MODEL:gemini-3.1-flash-lite-preview}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 20
    temperature: 0.2
  search:
    api-key: ${GEMINI_SEARCH_API_KEY:}
    model: ${GEMINI_SEARCH_MODEL:gemini-3.1-flash-lite-preview}
    embedding-model: ${GEMINI_SEARCH_EMBEDDING_MODEL:gemini-embedding-001}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 20
    temperature: 0.2
    semantic-enabled: ${GEMINI_SEARCH_SEMANTIC_ENABLED:true}
    embedding-dimensions: ${GEMINI_SEARCH_EMBEDDING_DIMENSIONS:3072}
    lexical-candidate-limit: ${GEMINI_SEARCH_LEXICAL_CANDIDATE_LIMIT:50}
    semantic-candidate-limit: ${GEMINI_SEARCH_SEMANTIC_CANDIDATE_LIMIT:50}
    embedding-batch-size: ${GEMINI_SEARCH_EMBEDDING_BATCH_SIZE:16}
    schema-management-enabled: ${SEARCH_SCHEMA_MANAGEMENT_ENABLED:false}

app:
  frontend:
    # OAuth 완료 뒤 token 없는 callback으로 돌아가는 곳
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  session:
    # 공개 배포에서 누락되면 기동에 실패한다. local profile만 별도 파일에서 false다.
    secure: ${SESSION_COOKIE_SECURE}

outbox:
  worker:
    # profile/배포에서 명시적으로 켠다. 설정 누락 상태로 기존 Outbox를 처리하지 않는다.
    enabled: ${OUTBOX_WORKER_ENABLED:false}
    # 재시도 백오프의 최소 간격이 1분이라 그보다 길게 잡으면 앞 단계가 뭉개진다
    fixed-delay: ${OUTBOX_WORKER_FIXED_DELAY:60000}

summary:
  force-live-enabled: ${WEEKLY_SUMMARY_FORCE_LIVE_ENABLED:false}
  cache:
    enabled: ${WEEKLY_SUMMARY_CACHE_ENABLED:false}
    redis-url: ${REDIS_URL:}
    ttl-seconds: ${WEEKLY_SUMMARY_CACHE_TTL_SECONDS:259200}
