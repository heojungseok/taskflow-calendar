[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
analyzer = { path = "../analyzer" }
axum = "0.8.9"
contract = { path = "../contract" }
incident = { path = "../incident" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serenity = { version = "0.12.5", default-features = false, features = ["gateway", "model", "client", "builder", "rustls_backend"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
ureq = { version = "3.5.2", features = ["json"] }
